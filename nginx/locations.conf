# Reverse proxy to the API, shared by the HTTP and HTTPS server blocks.

# Docker's internal DNS. Resolving "api" per request means a recreated api container
# (new IP after `up -d --build`) is found without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api http://api:4000;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Server-Sent Events: pass each event through immediately and keep the connection open.
location /api/v1/stream {
    proxy_pass $api;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

location / {
    proxy_pass $api;
}
