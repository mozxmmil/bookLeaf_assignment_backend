# Nginx site for the BookLeaf API.
# Nginx runs on the VPS itself; the API runs in Docker and listens on 127.0.0.1:4815 (API_PORT in .env).
# If you change API_PORT, change both proxy_pass lines below to the same port.
#
# Install (full steps in DEPLOYMENT.md):
#   sudo cp nginx/bookleaf-api.conf /etc/nginx/sites-available/bookleaf-api
#   sudo nano /etc/nginx/sites-available/bookleaf-api        # replace api.example.com with your domain
#   sudo ln -s /etc/nginx/sites-available/bookleaf-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.yourdomain.com             # adds HTTPS + HTTP->HTTPS redirect to this file

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # API requests are small JSON bodies (the API itself caps them at 100 kb).
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live updates (Server-Sent Events): send each event at once and keep the connection open.
    location /api/v1/stream {
        proxy_pass http://127.0.0.1:4815;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # The URL carries the login token (EventSource can't send headers), so keep it out of the access log.
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4815;
    }
}
