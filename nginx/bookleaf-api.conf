# Nginx site for the BookLeaf API: https://api-assignments.muzammil.live
# Nginx runs on the VPS itself; the API runs in Docker and listens on 127.0.0.1:4815 (API_PORT in .env).
# If you change API_PORT, change both proxy_pass lines below to the same port.
#
# Install (full steps in DEPLOYMENT.md). The certificate must exist before this file is enabled:
#   sudo certbot certonly --nginx -d api-assignments.muzammil.live --deploy-hook "systemctl reload nginx"
#   sudo certbot certificates                                   # check the cert path matches ssl_certificate below
#   sudo cp nginx/bookleaf-api.conf /etc/nginx/sites-available/bookleaf-api
#   sudo ln -s /etc/nginx/sites-available/bookleaf-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name api-assignments.muzammil.live;
    return 301 https://$host$request_uri;
}

# ── BookLeaf API: api-assignments.muzammil.live ──────────────────────────────
server {
    listen 443 ssl;
    server_name api-assignments.muzammil.live;

    ssl_certificate     /etc/letsencrypt/live/api-assignments.muzammil.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-assignments.muzammil.live/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # API requests are small JSON bodies (the API itself caps them at 100 kb).
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Live updates (Server-Sent Events): send each event at once and keep the connection open.
    location /api/v1/stream {
        proxy_pass         http://127.0.0.1:4815;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        # The URL carries the login token (EventSource can't send headers), so keep it out of the access log.
        access_log         off;
    }

    location / {
        proxy_pass http://127.0.0.1:4815;
    }
}
