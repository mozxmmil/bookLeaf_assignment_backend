# Production stack for a VPS: Postgres + API.
# Nginx runs on the VPS itself (nginx/bookleaf-api.conf) and proxies HTTPS traffic to the API on 127.0.0.1.
# The frontend is deployed separately on Vercel. Full steps: DEPLOYMENT.md.
#   cp .env.prod.example .env.prod      # then fill in the values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: bookleaf-prod
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookleaf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: bookleaf
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published ports: only the api container can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookleaf -d bookleaf"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://bookleaf:${POSTGRES_PASSWORD}@db:5432/bookleaf
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash-lite}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?set CLIENT_ORIGIN (your Vercel URL) in .env.prod}
    # Bound to 127.0.0.1 only: reachable by Nginx on the same machine, not from the internet.
    # Host port 4815 (not 4000/5000/8000...) so it doesn't clash with other apps on a shared VPS.
    ports:
      - "127.0.0.1:${API_PORT:-4815}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
